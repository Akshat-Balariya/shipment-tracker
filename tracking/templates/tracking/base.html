{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Shipment Tracker{% endblock %}</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --ink: #16191d;
      --muted: #6b7280;
      --line: #e3e6ea;
      --accent: #1f6feb;
      --accent-ink: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--line);
    }
    .bar {
      max-width: 880px; margin: 0 auto; padding: 16px 20px;
      display: flex; align-items: center; gap: 16px;
    }
    .brand { font-weight: 650; letter-spacing: -0.01em; text-decoration: none; color: var(--ink); }
    .bar nav { margin-left: auto; display: flex; gap: 16px; }
    .bar nav a { color: var(--muted); text-decoration: none; font-size: 14px; }
    .bar nav a:hover { color: var(--ink); }
    main { max-width: 880px; margin: 0 auto; padding: 32px 20px 64px; }
    .card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 10px; padding: 24px;
    }
    h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -0.02em; }
    h2 { font-size: 17px; margin: 0 0 12px; }
    .sub { color: var(--muted); margin: 0 0 24px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    input[type=text] {
      width: 100%; padding: 10px 12px; font-size: 15px; font-family: inherit;
      border: 1px solid var(--line); border-radius: 7px; background: #fff; color: var(--ink);
    }
    input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
    .field { margin-bottom: 16px; }
    button, .btn {
      display: inline-block; padding: 10px 16px; font-size: 15px; font-family: inherit;
      font-weight: 550; border: 0; border-radius: 7px; cursor: pointer;
      background: var(--accent); color: var(--accent-ink); text-decoration: none;
    }
    button:hover, .btn:hover { filter: brightness(1.08); }
    .btn-quiet { background: transparent; color: var(--muted); border: 1px solid var(--line); }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); }
    th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
    tr:last-child td { border-bottom: 0; }
    code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 999px;
      background: #e8f0fe; color: #1a4fa0; font-size: 13px; font-weight: 600;
    }
    .empty { color: var(--muted); text-align: center; padding: 40px 0; }
    .timeline { list-style: none; margin: 0; padding: 0; }
    .timeline li { padding: 12px 0 12px 20px; border-left: 2px solid var(--line); position: relative; }
    .timeline li::before {
      content: ""; position: absolute; left: -6px; top: 18px;
      width: 10px; height: 10px; border-radius: 50%; background: var(--line);
    }
    .timeline li:first-child::before { background: var(--accent); }
    .timeline .when { color: var(--muted); font-size: 13px; }
    .timeline .note { color: var(--muted); font-size: 14px; }
    .row { display: flex; gap: 12px; align-items: center; }
    .spread { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
    .spread h1 { margin: 0; }
    .spread .btn { margin-left: auto; }
    dl.meta { display: grid; grid-template-columns: auto 1fr; gap: 8px 24px; margin: 0; font-size: 15px; }
    dl.meta dt { color: var(--muted); }
    dl.meta dd { margin: 0; }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <a class="brand" href="{% url 'home' %}">Shipment Tracker</a>
      <nav>
        <a href="{% url 'home' %}">Track</a>
        <a href="{% url 'admin_home' %}">Admin</a>
      </nav>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
